apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: usuario/fastapi-backend:1.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: backend-env

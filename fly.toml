# fly.toml app configuration file generated for backe-tenebris on 2025-11-27T13:41:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backe-tenebris'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
